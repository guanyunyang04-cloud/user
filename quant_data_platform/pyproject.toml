[project]
name = "quant-data-platform"
version = "0.1.0"
description = "Workspace-governed canonical quant data platform."
requires-python = ">=3.10"

[project.scripts]
qdp = "quant_data_platform.cli:main"

[project.optional-dependencies]
china-free-data = [
  "baostock==0.9.3",
  "mootdx==0.11.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../"]
markers = [
  "unit: fast deterministic unit tests",
  "smoke: fast changed-surface smoke tests",
  "integration: CLI, filesystem, or cross-package contract tests",
  "data_heavy: tests that build or validate memmap, parquet, or larger data artifacts",
  "external: tests requiring network, live providers, or third-party services",
  "benchmark: performance threshold tests",
]
