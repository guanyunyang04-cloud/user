name: yolos
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Keep the compiled numerical stack in conda where possible.
  # The current yolos env historically mixed conda MKL/intel-openmp,
  # PyTorch's bundled Intel OpenMP DLL, and pip numerical wheels. The torch
  # libiomp5md.dll copy is isolated in .openmp_conflict_backup_20260509.
  # Validate OpenMP without KMP_DUPLICATE_LIB_OK:
  #   python daily_research/tools/openmp_runtime_check.py --strict
  - numpy>=1.24,<3
  - pandas>=2.0,<3
  - scipy>=1.10,<2
  - scikit-learn>=1.7,<1.8
  - joblib>=1.3,<2
  - lightgbm>=4,<5
  - cvxpy>=1.7.4
  - scs>=3
  - clarabel>=0.10
  - pytorch>=2.4,<3
  - pytorch-cuda=12.4
  - fastapi>=0.115,<1
  - pydantic>=2.8,<3
  - uvicorn>=0.30,<1
  - jinja2>=3.1,<4
  - pip:
      - cvxpylayers>=0.1.9
      - diffcp>=1.1.0
  # tqcenter remains a workspace-local dependency provided by t0_project/tqcenter.py.
