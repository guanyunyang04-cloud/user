[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "Point-in-time A-share data and short-horizon research workspace."
requires-python = ">=3.11"
dependencies = [
  "duckdb",
  "numpy",
  "pandas",
  "psutil",
  "pyarrow",
]

[project.optional-dependencies]
research = [
  "lightgbm",
  "torch",
]
sources = [
  "akshare",
  "baostock==0.9.3",
  "efinance",
  "mootdx==0.11.7",
  "requests",
  "tdxpy",
]

[project.scripts]
quantlab = "quantlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: filesystem or cross-module contract tests",
  "data_heavy: tests that scan the current local datasets",
  "external: tests that require a live third-party source",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501"]
